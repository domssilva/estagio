<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Validação de Diplomas{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
</head>

<style>
    .unigran-bg {
        background: #034ea2;
    }
</style>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg unigran-bg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/" style="color: white;">
                <img src="https://www.unigraneuropa.com/_next/image?url=%2Fimages%2FEuropa%2Flogo-unigran-europa.png&w=384&q=75"
                    alt="Logo Unigran Europa" height="40" class="me-2">
                Validação de Diplomas
            </a>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="flex-fill">
        <div class="container my-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light py-4 text-center mt-auto">
        <div class="container">
            <span class="text-muted">Unigran Europa - Polo Barcelona © 2024</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
